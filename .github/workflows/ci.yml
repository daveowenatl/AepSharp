name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Verify: never try to launch a diff tool in CI; a mismatch just fails the test.
  DiffEngine_Disabled: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # When a Verify snapshot fails, publish the .received output so the diff
      # can be inspected from the workflow run.
      - name: Upload Verify snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-received
          path: '**/*.received.*'
          if-no-files-found: ignore
